name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff512f&color_dots=#ebedf0,#ffd8a8,#ffa94d,#ff6b35,#d9480f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff512f&color_dots=#161b22,#5c2a12,#a3401a,#e8590c,#ff6b35

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
